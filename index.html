<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Go My Picks!">
<meta name="theme-color" content="#2a6e2e">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>Go My Picks!</title>
<style>
  :root { --gap: 14px; --foot: 50px; --turfA: #2f7a33; --turfB: #2a6e2e; }
  @media (prefers-color-scheme: dark) { :root { --turfA: #215a25; --turfB: #1d4d21; } }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--turfB); }
  /* Turf + yard lines covering the whole screen (status bar on top, logo strip at the bottom) */
  #turf { position: fixed; left: 0; right: 0; top: -60px; bottom: -60px; z-index: 0;
    background-color: var(--turfB);
    background-image: linear-gradient(to right, rgba(255,255,255,.55) 0, rgba(255,255,255,.55) 2px, transparent 2px),
                      repeating-linear-gradient(to right, var(--turfA) 0 44px, var(--turfB) 44px 88px);
    background-size: 44px 100%, 88px 100%; background-position: center top; }
  #app { position: fixed; left: 0; width: 100%; z-index: 1; border: 0; display: block; background: #111418;
    top: calc(env(safe-area-inset-top, 0px) + var(--gap)); height: 70vh; }
  /* midfield logo in the strip below the app */
  #logo { position: fixed; z-index: 1; left: 50%; transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom, 0px) + (var(--foot) - 40px) / 2); height: 40px; pointer-events: none;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,.45)); }
  #probe { position: fixed; top: 0; bottom: 0; left: 0; width: 1px; visibility: hidden; }
  #probeB { position: fixed; bottom: 0; left: 0; width: 1px; height: env(safe-area-inset-bottom, 0px); visibility: hidden; }
</style>
</head>
<body>
<div id="turf"></div>
<div id="probe"></div><div id="probeB"></div>
<iframe id="app" title="Go My Picks!" allow="clipboard-write"></iframe>
<svg id="logo" viewBox="0 0 120 60" aria-label="Go My Picks!">
  <path d="M6 30 C 22 4, 98 4, 114 30 C 98 56, 22 56, 6 30 Z" fill="#8B4A1C" stroke="#ffffff" stroke-width="3"/>
  <path d="M20 30 C 30 14, 90 14, 100 30" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1.2"/>
  <text x="60" y="27" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="13" fill="#ffffff">GO MY</text>
  <text x="60" y="43" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="14" fill="#ffffff">PICKS!</text>
  <path d="M14 30 h6 M100 30 h6" stroke="#ffffff" stroke-width="2"/>
</svg>
<script>
  // ▼▼ Paste your Apps Script web app link (ends in /exec) between the quotes ▼▼
  const APP_URL = 'https://script.google.com/macros/s/AKfycbxgRVWZw8MqjR0X715eCh27NiKC8cSjmYxiVAcMnBgF-jkDd4oZLFP87Exz3pH7puw/exec';
  // ▲▲ ------------------------------------------------------------------------ ▲▲
  const frame = document.getElementById('app');
  frame.src = APP_URL;
  let appWin = null;

  // Size the app exactly: full screen minus the status bar/gap on top and the logo strip + home indicator below.
  function layout() {
    const full = document.getElementById('probe').offsetHeight;
    const bottomInset = document.getElementById('probeB').offsetHeight;
    const top = frame.getBoundingClientRect().top;
    const foot = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--foot')) || 50;
    frame.style.height = Math.max(200, full - top - bottomInset - foot) + 'px';
    sendSize();
  }
  function sendSize() { if (appWin) appWin.postMessage({ pickemVH: frame.clientHeight }, '*'); }

  window.addEventListener('message', function (e) {
    if (e.data && e.data.pickemHead) {
      appWin = e.source;
      const r = document.documentElement.style;
      if (e.data.turfA) r.setProperty('--turfA', e.data.turfA);
      if (e.data.turfB) r.setProperty('--turfB', e.data.turfB);
      document.querySelector('meta[name="theme-color"]').setAttribute('content', e.data.pickemHead);
      layout();
    }
  });
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', function () { setTimeout(layout, 300); });
  layout(); setTimeout(layout, 500);
</script>
</body>
</html>
