<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Go My Picks!">
<meta name="theme-color" content="#1F3864">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>Go My Picks!</title>
<style>
  :root { --gap: 14px; }   /* extra space below the clock so the header clears iPhone's blur */
  /* Football-field turf behind the status bar (top) and home indicator (bottom); lines up with the app's header */
  :root { --turfA: #2f7a33; --turfB: #2a6e2e; }
  @media (prefers-color-scheme: dark) { :root { --turfA: #215a25; --turfB: #1d4d21; } }
  html, body { margin: 0; height: 100%; overflow: hidden;
    background-color: var(--turfB);
    background-image: linear-gradient(to right, rgba(255,255,255,.55) 0, rgba(255,255,255,.55) 2px, transparent 2px),
                      repeating-linear-gradient(to right, var(--turfA) 0 44px, var(--turfB) 44px 88px);
    background-size: 44px 100%, 88px 100%;
    background-position: center top; }
  #app {
    position: fixed; left: 0;
    top: calc(env(safe-area-inset-top, 0px) + var(--gap));
    width: 100%;
    height: calc(100vh - env(safe-area-inset-top, 0px) - var(--gap) - env(safe-area-inset-bottom, 0px));
    height: calc(100dvh - env(safe-area-inset-top, 0px) - var(--gap) - env(safe-area-inset-bottom, 0px));
    border: 0; display: block; background: #111418;
  }
</style>
</head>
<body>
<iframe id="app" title="Go My Picks!" allow="clipboard-write"></iframe>
<script>
  // ▼▼ Paste your Apps Script web app link (ends in /exec) between the quotes ▼▼
  const APP_URL = 'https://script.google.com/macros/s/AKfycbxgRVWZw8MqjR0X715eCh27NiKC8cSjmYxiVAcMnBgF-jkDd4oZLFP87Exz3pH7puw/exec';
  // ▲▲ ------------------------------------------------------------------------ ▲▲
  const frame = document.getElementById('app');
  frame.src = APP_URL;
  let appWin = null;
  // Tell the app exactly how tall the screen area is, so its header can stay fixed while the content scrolls.
  function sendSize() { if (appWin) appWin.postMessage({ pickemVH: frame.clientHeight }, '*'); }
  window.addEventListener('message', function (e) {
    if (e.data && e.data.pickemHead) {
      appWin = e.source; sendSize();
      const r = document.documentElement.style;
      if (e.data.turfA) r.setProperty('--turfA', e.data.turfA);
      if (e.data.turfB) r.setProperty('--turfB', e.data.turfB);
      document.querySelector('meta[name="theme-color"]').setAttribute('content', e.data.pickemHead);
    }
  });
  window.addEventListener('resize', sendSize);
  window.addEventListener('orientationchange', function () { setTimeout(sendSize, 300); });
</script>
</body>
</html>
