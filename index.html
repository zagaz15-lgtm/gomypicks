<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- standard status bar: the app window starts below the clock, so iOS gives it the full height to the bottom -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Go My Picks!">
<meta name="theme-color" content="#2a6e2e">
<meta name="color-scheme" content="light dark">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>Go My Picks!</title>
<script src="config.js"></script>
<style>
  :root { --gap: 4px; --foot: 0px; --turfA: #2f7a33; --turfB: #2a6e2e; }
  @media (prefers-color-scheme: dark) { :root { --turfA: #215a25; --turfB: #1d4d21; } }
  /* The turf pattern is also painted on the page itself (tiles forever), so any area iOS draws outside
     the visible page — under the home-indicator bar — still shows stripes and yard lines. */
  html { margin: 0; height: 100%; overflow: hidden;
    background-color: var(--turfB);
    background-image: linear-gradient(to right, rgba(255,255,255,.55) 0, rgba(255,255,255,.55) 2px, transparent 2px),
                      repeating-linear-gradient(to right, var(--turfA) 0 44px, var(--turfB) 44px 88px);
    background-size: 44px 88px, 88px 88px; background-position: center top; background-repeat: repeat; }
  body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  /* Turf + yard lines covering the whole screen (behind the status bar) */
  #turf { position: fixed; left: 0; right: 0; top: -60px; height: calc(100lvh + 240px); z-index: 0;
    background-color: var(--turfB);
    background-image: linear-gradient(to right, rgba(255,255,255,.55) 0, rgba(255,255,255,.55) 2px, transparent 2px),
                      repeating-linear-gradient(to right, var(--turfA) 0 44px, var(--turfB) 44px 88px);
    background-size: 44px 100%, 88px 100%; background-position: center top; }
  #app { position: fixed; left: 0; width: 100%; z-index: 1; border: 0; display: block; background: #111418;
    top: calc(env(safe-area-inset-top, 0px) + var(--gap)); height: 70vh; }
  #probe { position: fixed; top: 0; bottom: 0; left: 0; width: 1px; visibility: hidden; }
  #probeB { position: fixed; bottom: 0; left: 0; width: 1px; height: env(safe-area-inset-bottom, 0px); visibility: hidden; }
</style>
</head>
<body>
<div id="turf"></div>
<div id="probe"></div><div id="probeB"></div>
<iframe id="app" title="Go My Picks!" allow="clipboard-write"></iframe>
<script>
  // The app link lives in config.js, so this file can be replaced anytime without re-pasting it.
  const APP_URL = (window.GMP_APP_URL || '').trim();
  const frame = document.getElementById('app');
  if (/^https:\/\/script\.google\.com\/.+\/exec/.test(APP_URL)) frame.src = APP_URL;
  else frame.srcdoc = '<body style="font:16px -apple-system,sans-serif;padding:24px;color:#222;background:#fff">' +
    '<h3>Almost there!</h3><p>The app link is missing. On GitHub, open <b>config.js</b> and paste your Apps Script web-app link ' +
    '(it ends in <b>/exec</b>) between the quotes, then commit.</p></body>';
  let appWin = null;

  // Size the app exactly: full screen minus the status bar/gap on top and the logo strip + home indicator below.
  function layout() {
    const full = document.getElementById('probe').offsetHeight;
    const bottomInset = document.getElementById('probeB').offsetHeight;
    const top = frame.getBoundingClientRect().top;
    const foot = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--foot')) || 50;
    frame.style.height = Math.max(200, full - top) + 'px';   // all the way to the bottom of the screen
    bottomPad = bottomInset;                                    // the app keeps its last item clear of the home bar
    sendSize();
  }
  let bottomPad = 0;
  function sendSize() { if (appWin) appWin.postMessage({ pickemVH: frame.clientHeight, pickemBottom: bottomPad }, '*'); }

  window.addEventListener('message', function (e) {
    if (e.data && e.data.pickemHead) {
      appWin = e.source;
      const r = document.documentElement.style;
      if (e.data.turfA) r.setProperty('--turfA', e.data.turfA);
      if (e.data.turfB) r.setProperty('--turfB', e.data.turfB);
      document.querySelector('meta[name="theme-color"]').setAttribute('content', e.data.pickemHead);
      layout();
    }
  });
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', function () { setTimeout(layout, 300); });
  layout(); setTimeout(layout, 500);
</script>
</body>
</html>
